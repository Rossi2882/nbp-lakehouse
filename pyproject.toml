[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nbp-lakehouse"
version = "0.1.0"
description = "Data platform for NBP exchange rates and gold prices: ingest, lakehouse (bronze/silver/gold), orchestration and CI/CD."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Adam Korbik" }]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.6",
]

[project.scripts]
nbp-ingest = "nbp_lakehouse.ingest.run_ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
